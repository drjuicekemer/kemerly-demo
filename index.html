<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5f57"><title>Kemerly — feel like a local</title><style>
:root{--ink:#173238;--muted:#6e8184;--green:#0a6d62;--deep:#064f49;--mint:#e7f4f0;--cream:#fbfaf6;--line:#e4e9e7;--white:#fff;--shadow:0 12px 35px rgba(18,55,52,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f8f7;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;height:68px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line)}.brand{font-size:26px;font-weight:900;letter-spacing:-1.2px;color:var(--deep)}.brand i{font-style:normal;color:#e89038}.claim{font-size:11px;color:var(--muted);margin-left:9px}.grow{flex:1}.lang{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px}.merchant{margin-left:8px;border:0;background:var(--ink);color:#fff;border-radius:11px;padding:9px 12px;font-weight:700}
main{max-width:1120px;margin:auto;padding:16px 16px 90px}.hero{min-height:390px;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(115deg,rgba(4,67,61,.96),rgba(9,108,96,.80)),url('https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1600&q=80') center/cover;color:#fff;padding:38px 28px;display:flex;align-items:end;box-shadow:var(--shadow)}.heroContent{max-width:720px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800;color:#c9eee5}.hero h1{font-size:clamp(38px,7vw,72px);line-height:.94;letter-spacing:-3px;margin:10px 0 14px}.hero p{font-size:17px;max-width:580px;color:#e3f3ef;line-height:1.5}.search{margin-top:22px;background:#fff;border-radius:16px;padding:6px;display:flex;box-shadow:0 10px 30px #00251f44}.search input{min-width:0;flex:1;border:0;outline:0;padding:13px 14px;color:var(--ink)}.search button{border:0;background:#e9923e;color:#fff;font-weight:800;border-radius:11px;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:21px}.stat small{display:block;color:var(--muted);margin-top:2px}
.section{margin-top:34px}.sectionHead{display:flex;align-items:end;gap:10px;margin-bottom:14px}.sectionHead h2{font-size:24px;letter-spacing:-.7px;margin:0}.sectionHead p{margin:0;color:var(--muted);font-size:13px}.sectionHead button{margin-left:auto;border:0;background:none;color:var(--green);font-weight:800}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;white-space:nowrap;color:var(--ink)}.chip:hover{border-color:var(--green)}
.storeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.store{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(20,50,48,.04);transition:.2s}.store:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.cover{height:150px;background-size:cover;background-position:center;position:relative}.badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);padding:6px 8px;border-radius:9px;font-size:10px;font-weight:800}.verified{color:var(--green)}.storeBody{padding:13px}.store h3{margin:0;font-size:17px}.meta{color:var(--muted);font-size:12px;margin:5px 0 11px}.go{border:0;background:none;padding:0;color:var(--green);font-weight:800}
.back{border:0;background:#edf3f1;border-radius:10px;padding:9px 11px;margin-right:10px}.storeHero{height:310px;border-radius:26px;background-size:cover;background-position:center;position:relative;overflow:hidden}.storeHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.76))}.storeTitle{position:absolute;z-index:2;bottom:22px;left:22px;color:#fff}.storeTitle h1{margin:4px 0;font-size:34px;letter-spacing:-1.3px}.storeTitle p{margin:0;color:#e8eeee}.storeBar{background:#fff;border:1px solid var(--line);border-radius:17px;margin-top:12px;padding:12px;display:flex;gap:8px;overflow:auto}.storeBar button,.actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;white-space:nowrap}.storeBar .primary,.actions .primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:800}
.productGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.productImg{height:180px;background-size:cover;background-position:center}.productBody{padding:12px}.product h3{margin:0 0 4px;font-size:16px}.product small{color:var(--muted)}.price{font-size:19px;font-weight:900;margin-top:9px}.detail{display:grid;gap:14px}.detailImg{height:380px;border-radius:24px;background-size:cover;background-position:center}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px}.panel h1{font-size:30px;letter-spacing:-1px;margin:5px 0}.desc{color:var(--muted);line-height:1.55}.options{display:flex;gap:8px;flex-wrap:wrap}.option{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.notice{background:#fff6dc;border:1px solid #eedba2;border-radius:12px;padding:10px;font-size:12px;color:#735d22;margin-top:13px}
.map{height:560px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(105deg,#dfe9dc 0 70%,#acd9e3 70%)}.map:before{content:"";position:absolute;width:130%;height:12px;background:#fff;left:-15%;top:47%;transform:rotate(-13deg);box-shadow:0 0 0 3px #d2d8d4}.pin{position:absolute;width:46px;height:46px;border:3px solid #fff;background:var(--green);color:#fff;border-radius:50% 50% 50% 10%;transform:rotate(-45deg);box-shadow:0 5px 15px #0003}.pin span{display:block;transform:rotate(45deg);font-size:18px}.mapLabel{position:absolute;right:5%;top:8%;font-size:25px;font-weight:900;color:#4b8e9c88}.adminWrap{display:grid;gap:12px}.adminHero{background:var(--ink);color:#fff;border-radius:24px;padding:22px}.adminHero p{color:#c7d4d4}.metricGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.metric b{font-size:25px}.metric small{display:block;color:var(--muted)}.adminList{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.row{display:flex;align-items:center;padding:13px;border-bottom:1px solid var(--line);gap:12px}.thumb{width:52px;height:52px;border-radius:10px;background-size:cover;background-position:center}.row .grow b{display:block}.row small{color:var(--muted)}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;gap:min(9vw,100px);padding:8px 10px max(8px,env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#64777a;font-size:11px;min-width:52px}.bottom b{display:block;font-size:20px;color:var(--ink);margin-bottom:2px}
@media(min-width:760px){main{padding-top:24px}.storeGrid{grid-template-columns:repeat(4,1fr)}.productGrid{grid-template-columns:repeat(4,1fr)}.detail{grid-template-columns:1.15fr .85fr}.metricGrid{grid-template-columns:repeat(4,1fr)}.cover{height:180px}}
</style></head><body><header class="top" id="top"><div class="brand">Kemerl<i>y</i></div><span class="claim">feel like a local.</span><div class="grow"></div><select class="lang" onchange="langDemo(this.value)"><option>TR</option><option>EN</option><option>RU</option><option>DE</option><option>PL</option><option>UA</option><option>NO</option><option>AR</option><option>FR</option></select><button class="merchant" onclick="admin()">Esnaf Paneli</button></header><main id="app"></main><nav class="bottom"><button onclick="home()"><b>⌂</b>Ana Sayfa</button><button onclick="discover()"><b>⌕</b>Keşfet</button><button onclick="showMap()"><b>⌖</b>Harita</button><button onclick="favorites()"><b>♡</b>Favoriler</button></nav><script>
const IMG={
drink:"https://images.unsplash.com/photo-1622597467836-f3285f2131b8?auto=format&fit=crop&w=900&q=80",
fashion:"https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=900&q=80",
leather:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=80",
barber:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=900&q=80",
jewel:"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=900&q=80",
gift:"https://images.unsplash.com/photo-1513885535751-8b9238bd345a?auto=format&fit=crop&w=900&q=80",
coffee:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80",
outdoor:"https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=900&q=80"};
const S=[
{n:"Organix Smoothie Café",c:"Yiyecek & İçecek",r:"Kemer Merkez",img:IMG.drink,open:"Açık · 23:30'a kadar",p:[["Taze Nar Suyu",300,IMG.drink,"Taze sıkım nar. İlave şeker içermez."],["Kemer Mix",300,IMG.drink,"Portakal, muz ve çileğin Kemer yorumu."],["Mango Milkshake",350,IMG.drink,"Mango, vanilyalı dondurma ve süt."],["Very Berry",350,IMG.drink,"Kırmızı meyvelerle yoğun ve ferah."]]},
{n:"Ali Moda",c:"Giyim & Tekstil",r:"Kemer Merkez",img:IMG.fashion,open:"Açık · 22:00'a kadar",p:[["Keten Elbise",990,IMG.fashion,"Yaz için hafif dokulu keten elbise."],["Keten Gömlek",1250,IMG.fashion,"Rahat kesim doğal dokulu gömlek."],["Yazlık Elbise",890,IMG.fashion,"Kemer yazına uygun hafif elbise."],["Keten Pantolon",1100,IMG.fashion,"Nefes alan rahat kalıp."]]},
{n:"Tonni Bellucci",c:"Deri & Çanta",r:"Kemer Merkez",img:IMG.leather,open:"Açık · 22:30'a kadar",p:[["Deri Omuz Çantası",5200,IMG.leather,"Günlük kullanıma uygun deri omuz çantası."],["Kadın Deri Çanta",6900,IMG.leather,"Zamansız form, geniş iç hacim."],["Deri Cüzdan",2400,IMG.leather,"Kompakt çok bölmeli deri cüzdan."],["Deri Kemer",1950,IMG.leather,"Klasik tokalı deri kemer."]]},
{n:"Kemer Barber",c:"Kuaför & Bakım",r:"Kemer Merkez",img:IMG.barber,open:"Açık · 21:00'a kadar",p:[["Erkek Saç Kesimi",450,IMG.barber,"Danışmanlık ve profesyonel kesim."],["Saç & Sakal",600,IMG.barber,"Saç kesimi ve sakal tasarımı."],["Sakal Tasarımı",250,IMG.barber,"Yüz formuna göre şekillendirme."],["Bakım Paketi",1200,IMG.barber,"Kesim, sakal ve bakım paketi."]]},
{n:"Marina Silver",c:"Takı & Saat",r:"Kemer Merkez",img:IMG.jewel,open:"Açık · 22:00'a kadar",p:[["Gümüş Kolye",1850,IMG.jewel,"Minimal gümüş kolye."],["Taşlı Bileklik",1450,IMG.jewel,"Zarif taş detaylı bileklik."],["Minimal Yüzük",1250,IMG.jewel,"Günlük kullanıma uygun tasarım."],["Gümüş Küpe",1100,IMG.jewel,"Sade ve hafif küpe."]]},
{n:"Moonlight Gifts",c:"Hediyelik Eşya",r:"Kemer Merkez",img:IMG.gift,open:"Açık · 23:00'a kadar",p:[["Kemer Hatıra Seti",420,IMG.gift,"Kemer temalı seçili hediyeler."],["El Yapımı Nazar",280,IMG.gift,"El yapımı dekoratif nazar."],["Kemer Kupası",240,IMG.gift,"Kemer baskılı seramik kupa."],["Ahşap Hatıra",350,IMG.gift,"Yerel temalı ahşap obje."]]},
{n:"Göynük Style",c:"Giyim & Tekstil",r:"Göynük",img:IMG.fashion,open:"Açık",p:[["Yazlık Gömlek",900,IMG.fashion,"Hafif yazlık gömlek."],["Plaj Elbisesi",1350,IMG.fashion,"Rahat plaj elbisesi."],["Şort",780,IMG.fashion,"Günlük yazlık şort."]]},
{n:"Canyon Outdoor",c:"Spor & Outdoor",r:"Göynük",img:IMG.outdoor,open:"Açık",p:[["Yürüyüş Çantası",2200,IMG.outdoor,"Günübirlik parkurlar için."],["Trekking Şapkası",750,IMG.outdoor,"Güneş korumalı hafif şapka."],["Matara",650,IMG.outdoor,"Outdoor kullanım için matara."]]},
{n:"Pine Café",c:"Restoran & Kafe",r:"Çamyuva",img:IMG.coffee,open:"Açık",p:[["Türk Kahvesi",150,IMG.coffee,"Geleneksel Türk kahvesi."],["Cappuccino",190,IMG.coffee,"Espresso ve süt köpüğü."],["Cheesecake",260,IMG.coffee,"Günün cheesecake'i."]]},
{n:"Tekirova Leather",c:"Deri & Çanta",r:"Tekirova",img:IMG.leather,open:"Açık",p:[["Deri Çanta",5400,IMG.leather,"Günlük deri çanta."],["Kartlık",1600,IMG.leather,"İnce deri kartlık."],["Deri Kemer",1800,IMG.leather,"Klasik deri kemer."]]}
];
const app=document.getElementById("app"),topbar=document.getElementById("top");const money=n=>n.toLocaleString("tr-TR")+" TL";function setBack(fn="home()"){topbar.innerHTML='<button class="back" onclick="'+fn+'">←</button><div class="brand">Kemerl<i>y</i></div><span class="claim">feel like a local.</span><div class="grow"></div><select class="lang"><option>TR</option><option>EN</option><option>RU</option><option>DE</option></select>'}function resetTop(){topbar.innerHTML='<div class="brand">Kemerl<i>y</i></div><span class="claim">feel like a local.</span><div class="grow"></div><select class="lang" onchange="langDemo(this.value)"><option>TR</option><option>EN</option><option>RU</option><option>DE</option><option>PL</option><option>UA</option><option>NO</option><option>AR</option><option>FR</option></select><button class="merchant" onclick="admin()">Esnaf Paneli</button>'}
function card(s,i){return '<article class="store" onclick="store('+i+')"><div class="cover" style="background-image:url(\''+s.img+'\')"><span class="badge verified">✓ Kemerly Verified</span></div><div class="storeBody"><h3>'+s.n+'</h3><div class="meta">'+s.c+' · '+s.r+'<br>'+s.open+'</div><button class="go">Mağazayı keşfet →</button></div></article>'}
function home(){resetTop();app.innerHTML='<section class="hero"><div class="heroContent"><div class="eyebrow">Kemer Dijital Çarşı</div><h1>Kemer’i keşfet.<br>Yerel gibi yaşa.</h1><p>Yerel mağazaları, ürünleri, lezzetleri ve hizmetleri tek yerde keşfet. QR’dan gir, bütün Kemer’e açıl.</p><div class="search"><input id="q" placeholder="Ne arıyorsun? Deri çanta, nar suyu, berber..."><button onclick="searchNow()">Ara</button></div></div></section><div class="stats"><div class="stat"><b>40+</b><small>demo işletme</small></div><div class="stat"><b>5</b><small>Kemer bölgesi</small></div><div class="stat"><b>9</b><small>dil hedefi</small></div></div><section class="section"><div class="sectionHead"><div><h2>Ne arıyorsun?</h2><p>Kemer’de kategori kategori keşfet.</p></div></div><div class="chips"><button class="chip" onclick="category(\'Giyim\')">👗 Giyim</button><button class="chip" onclick="category(\'Deri\')">👜 Deri & Çanta</button><button class="chip" onclick="category(\'Takı\')">💎 Takı & Saat</button><button class="chip" onclick="category(\'İçecek\')">🥤 Yiyecek & İçecek</button><button class="chip" onclick="category(\'Kuaför\')">✂️ Kuaför</button><button class="chip" onclick="category(\'Outdoor\')">🥾 Outdoor</button></div></section><section class="section"><div class="sectionHead"><div><h2>Kemerly seçkisi</h2><p>Bugün keşfedebileceğin yerel noktalar.</p></div><button onclick="discover()">Tümünü gör →</button></div><div class="storeGrid">'+S.slice(0,8).map(card).join("")+'</div></section>';scrollTo(0,0)}
function discover(list=S,title="Kemerly işletmeleri"){setBack();app.innerHTML='<section class="section" style="margin-top:5px"><div class="sectionHead"><div><h2>'+title+'</h2><p>Kemer Merkez · Göynük · Çamyuva · Kiriş · Tekirova</p></div></div><div class="chips"><button class="chip" onclick="discover()">Tümü</button><button class="chip" onclick="region(\'Kemer Merkez\')">Kemer Merkez</button><button class="chip" onclick="region(\'Göynük\')">Göynük</button><button class="chip" onclick="region(\'Çamyuva\')">Çamyuva</button><button class="chip" onclick="region(\'Tekirova\')">Tekirova</button></div><div class="storeGrid" style="margin-top:14px">'+list.map(s=>card(s,S.indexOf(s))).join("")+'</div></section>';scrollTo(0,0)}
function store(i){let s=S[i];setBack();app.innerHTML='<section class="storeHero" style="background-image:url(\''+s.img+'\')"><div class="storeTitle"><span class="badge verified" style="position:static">✓ Kemerly Verified</span><h1>'+s.n+'</h1><p>'+s.c+' · '+s.r+' · ★ 4.8 · '+s.open+'</p></div></section><div class="storeBar"><button class="primary" onclick="alert(\'Demo: WhatsApp son işlem noktası\')">💬 WhatsApp</button><button onclick="showMap()">⌖ Yol Tarifi</button><button onclick="alert(\'Demo: mağaza aranıyor\')">☎ Ara</button><button onclick="discover()">◫ Kemerly’de Keşfet</button></div><section class="section"><div class="sectionHead"><div><h2>Ürünler & hizmetler</h2><p>Son güncelleme: bugün</p></div></div><div class="productGrid">'+s.p.map((p,j)=>'<article class="product" onclick="product('+i+','+j+')"><div class="productImg" style="background-image:url(\''+p[2]+'\')"></div><div class="productBody"><h3>'+p[0]+'</h3><small>'+s.n+'</small><div class="price">'+money(p[1])+'</div></div></article>').join("")+'</div></section>';scrollTo(0,0)}
function product(i,j){let s=S[i],p=s.p[j];setBack("store("+i+")");app.innerHTML='<div class="detail"><div class="detailImg" style="background-image:url(\''+p[2]+'\')"></div><div class="panel"><small>'+s.n+' › '+s.c+'</small><h1>'+p[0]+'</h1><div class="price">'+money(p[1])+'</div><p class="desc">'+p[3]+' Kemerly üzerinden ürünü keşfet; son stok ve seçenekleri doğrudan işletmeye sor.</p><h3>Seçenekler</h3><div class="options"><button class="option">S</button><button class="option">M</button><button class="option">L</button><button class="option">XL</button></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="alert(\'Demo: WhatsApp son işlem noktası\')">WhatsApp’tan Sor</button><button onclick="store('+i+')">Mağazada Gör</button><button onclick="alert(\'Favorilere eklendi\')">♡ Favori</button></div><div class="notice">Kemerly Demo City verisidir. Demo fiyat/stok bilgileri gerçek satış taahhüdü değildir.</div></div></div>';scrollTo(0,0)}
function category(q){discover(S.filter(s=>s.c.includes(q)),q+" kategorisi")}function region(q){discover(S.filter(s=>s.r==q),q)}function searchNow(){let q=(document.getElementById("q").value||"").toLocaleLowerCase("tr");let a=S.filter(s=>(s.n+" "+s.c+" "+s.r+" "+s.p.map(p=>p[0]).join(" ")).toLocaleLowerCase("tr").includes(q));discover(a,"Arama: "+q)}
function showMap(){setBack();app.innerHTML='<div class="sectionHead"><div><h2>Kemerly Haritası</h2><p>Sadece Kemerly’de aktif demo noktaları.</p></div></div><div class="map"><div class="mapLabel">AKDENİZ</div>'+S.map((s,i)=>'<button class="pin" onclick="store('+i+')" style="left:'+(6+(i*17)%72)+'%;top:'+(7+(i*21)%78)+'%"><span>'+["🥤","👗","👜","✂️","💎","🎁","👕","🥾","☕","👜"][i]+'</span></button>').join("")+'</div>';scrollTo(0,0)}
function admin(){setBack();let s=S[1];app.innerHTML='<div class="adminWrap"><section class="adminHero"><div class="eyebrow">Kemerly Esnaf</div><h1>Günaydın, Ali Moda</h1><p>Dijital vitrinin yayında. Ürünlerini güncel tut, müşterilerin seni Kemer’in her yerinden bulsun.</p></section><div class="metricGrid"><div class="metric"><b>4.820</b><small>Mağaza ziyareti</small></div><div class="metric"><b>11.340</b><small>Ürün görüntüleme</small></div><div class="metric"><b>286</b><small>WhatsApp tıklaması</small></div><div class="metric"><b>91</b><small>Yol tarifi</small></div></div><section class="section"><div class="sectionHead"><div><h2>Ürünlerim</h2><p>4 aktif ürün · bugün güncellendi</p></div><button onclick="alert(\'Demo: Fotoğraf yükle → AI ürün kartı → fiyat → yayınla\')">+ Yeni ürün</button></div><div class="adminList">'+s.p.map(p=>'<div class="row"><div class="thumb" style="background-image:url(\''+p[2]+'\')"></div><div class="grow"><b>'+p[0]+'</b><small>'+money(p[1])+' · Yayında · 9 dil</small></div><button class="option" onclick="alert(\'Demo ürün düzenleme ekranı\')">Düzenle</button></div>').join("")+'</div></section><div class="actions"><button class="primary" onclick="store(1)">Müşteri görünümü</button><button onclick="alert(\'QR: Scan this shop. Discover Kemer.\')">▦ QR Kodum</button><button onclick="alert(\'Demo: mağaza bilgileri\')">Mağaza Bilgileri</button></div></div>';scrollTo(0,0)}
function favorites(){setBack();app.innerHTML='<section class="section"><div class="sectionHead"><div><h2>Favorilerim</h2><p>Kemer’de tekrar bakmak istediğin yerler.</p></div></div><div class="storeGrid">'+[S[1],S[2],S[0]].map(s=>card(s,S.indexOf(s))).join("")+'</div></section>'}function langDemo(v){if(v!="TR")alert(v+" dil görünümü demo kapsamına hazırlanıyor. Kemerly hedefi 9 dil.")}home();
</script></body></html>
