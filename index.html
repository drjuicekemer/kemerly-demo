function showMap(focusIndex){setBack();app.innerHTML='<div class="sectionHead"><div><h2>Kemerly Haritası</h2><p>Kemerly noktalarını haritada keşfet.</p></div></div><div class="mapNote">Demo sürümü: Noktalar Kemer bölgesini göstermek için örnek konumlandırılmıştır; gerçek işletme adresi taahhüdü değildir.</div><div id="kmap" class="map"></div>';scrollTo(0,0);setTimeout(()=>{if(!window.L){document.getElementById("kmap").innerHTML='<div style="padding:24px"><b>Harita yüklenemedi.</b><p>İnternet bağlantını kontrol edip tekrar aç.</p></div>';return}const pts=[[36.6024,30.5598],[36.6005,30.5615],[36.6043,30.5576],[36.5979,30.5631],[36.6060,30.5557],[36.6017,30.5651],[36.6090,30.5541],[36.5958,30.5590],[36.6030,30.5668],[36.6072,30.5627]];const icons=["🥤","👗","👜","✂️","💎","🎁","👕","🥾","☕","👜"];const m=L.map("kmap",{zoomControl:true}).setView([36.6028,30.5608],14);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(m);S.forEach((s,i)=>{const ic=L.divIcon({className:"",html:'<div class="kpin"><span>'+icons[i%icons.length]+'</span></div>',iconSize:[38,38],iconAnchor:[19,38],popupAnchor:[0,-34]});const mk=L.marker(pts[i],{icon:ic}).addTo(m).bindPopup('<div class="mapPopup"><b>'+s.n+'</b><small>'+s.c+' · '+s.r+'<br>Demo Kemerly Noktası</small><button onclick="store('+i+')">Mağazayı Aç →</button></div>');if(i===focusIndex){mk.openPopup();m.setView(pts[i],16)}});setTimeout(()=>m.invalidateSize(),100)},50)}

function merchantEntry(){customerNav(false);topbar.className="merchantTop";topbar.innerHTML='<div class="brand">Kemerl<i>y</i></div><span class="claim">işletme alanı</span><div class="grow"></div><button class="merchant" onclick="home()">Çıkış</button>';app.innerHTML='<div class="onboard"><section class="merchantWelcome"><div class="eyebrow">KEMERLY İŞLETME</div><h1>Dijital dükkânını yönet</h1><p>Demo akışında mevcut mağazanı açabilir veya geliştiriciye ihtiyaç duymadan yeni bir işletme oluşturabilirsin.</p></section><div class="merchantChooser"><button class="merchantChoice" onclick="admin(1)"><b>Ali Moda</b><small>Mevcut demo mağazasını yönet →</small></button><button class="merchantChoice" onclick="merchantOnboarding()"><b>＋ Yeni işletme</b><small>Sektörünü seç, mağazan otomatik oluşsun →</small></button></div></div>';scrollTo(0,0)}
function merchantOnboarding(){customerNav(false);topbar.className="merchantTop";topbar.innerHTML='<button class="back" onclick="merchantEntry()">←</button><div class="merchantLogo">YENİ İŞLETME</div><span class="merchantStatus">Self-service demo</span><div class="grow"></div>';app.innerHTML='<div class="onboard"><section class="formCard"><h2>1. İşletmeni tanıt</h2><p>Bu bilgilerden Kemerly uygun dijital dükkân tipini otomatik üretir.</p><div class="formGrid"><div class="field full"><label>İşletme adı</label><input id="obName" placeholder="Örn. Deniz Boutique"></div><div class="field"><label>Sektör</label><select id="obCat"><option>Giyim & Tekstil</option><option>Deri & Çanta</option><option>Kuaför & Bakım</option><option>Takı & Saat</option><option>Hediyelik Eşya</option><option>Restoran & Kafe</option><option>Yiyecek & İçecek</option><option>Spor & Outdoor</option></select></div><div class="field"><label>Bölge</label><select id="obRegion"><option>Kemer Merkez</option><option>Göynük</option><option>Çamyuva</option><option>Kiriş</option><option>Tekirova</option></select></div><div class="field"><label>WhatsApp / telefon</label><input id="obPhone" placeholder="+90 ..."></div><div class="field"><label>Çalışma saati</label><input id="obHours" value="Açık · 22:00\'a kadar"></div></div></section><section class="formCard"><h2>2. İlk ürün / hizmet</h2><p>Sonradan istediğin kadar ürün ekleyebilirsin. Bu ilk kayıt mağazanın gerçekten veriyle üretildiğini gösterir.</p><div class="formGrid"><div class="field"><label>Ad</label><input id="obProduct" placeholder="Örn. Keten Gömlek"></div><div class="field"><label>Fiyat (TL)</label><input id="obPrice" type="number" placeholder="1250"></div><div class="field full"><label>Açıklama</label><textarea id="obDesc" placeholder="Ürün veya hizmeti kısaca anlat"></textarea></div></div></section><div class="formActions"><button onclick="merchantEntry()">Vazgeç</button><button class="save" onclick="createDemoMerchant()">Mağazayı oluştur →</button></div><div class="notice">Bu bir browser-based prototiptir. Gerçek üyelik, güvenli tenant izolasyonu, kalıcı sunucu veritabanı ve dosya depolama henüz yoktur.</div></div>';scrollTo(0,0)}
function catImage(cat){if(cat.includes("Giyim"))return IMG.fashion;if(cat.includes("Deri"))return IMG.leather;if(cat.includes("Kuaför"))return IMG.barber;if(cat.includes("Takı"))return IMG.jewel;if(cat.includes("Hediyelik"))return IMG.gift;if(cat.includes("Outdoor"))return IMG.outdoor;if(cat.includes("Restoran"))return IMG.coffee;return IMG.drink}
function createDemoMerchant(){const n=document.getElementById("obName").value.trim(),cat=document.getElementById("obCat").value,r=document.getElementById("obRegion").value,phone=document.getElementById("obPhone").value.trim(),hours=document.getElementById("obHours").value.trim(),pn=document.getElementById("obProduct").value.trim(),price=Number(document.getElementById("obPrice").value),desc=document.getElementById("obDesc").value.trim();if(!n||!pn||!price){alert("İşletme adı, ilk ürün/hizmet ve fiyat gerekli.");return}let slug=slugify(n),img=catImage(cat);if(S.some(s=>s.slug===slug)){slug=slug+"-"+Date.now().toString().slice(-5)}const s={n,c:cat,r,img,open:hours||"Çalışma saati belirtilmedi",phone,slug,p:[[pn,price,img,desc||"İşletme tarafından eklenen demo ürün/hizmet."]]};S.push(s);persistDemoStore(s);const i=S.length-1;merchantCreated(i)}
function merchantCreated(i){const s=S[i],u=shopUrl(s);customerNav(false);topbar.className="merchantTop";topbar.innerHTML='<div class="merchantLogo">'+s.n.toUpperCase()+'</div><span class="merchantStatus">● Mağazan oluştu</span><div class="grow"></div><button class="merchant" onclick="home()">Kemerly</button>';app.innerHTML='<div class="onboard"><section class="createdBox"><span class="demoTag">KOD YAZMADAN OLUŞTURULDU</span><h2>'+s.n+' hazır</h2><p>'+s.c+' kategorisine göre <b>'+shopType(s)+'</b> mağaza şablonu otomatik seçildi. Ürünün Kemerly keşif verisine de eklendi.</p><code>'+u+'</code><div class="qrBox"><div id="merchantQR"></div></div><div class="formActions"><button class="save" onclick="store('+i+')">Dijital mağazayı aç</button><button onclick="discover()">Kemerly keşfinde gör</button><button onclick="admin('+i+')">Mağazayı yönet</button></div></section></div>';setTimeout(()=>{const q=document.getElementById("merchantQR");if(window.QRCode&&q)new QRCode(q,{text:u,width:160,height:160});else if(q)q.innerHTML="<b>QR kitaplığı yüklenemedi.</b><br>"+u},20);scrollTo(0,0)}
function admin(idx=1){customerNav(false);let s=S[idx];topbar.className="merchantTop";topbar.innerHTML='<div class="merchantLogo">'+s.n.toUpperCase()+'</div><span class="merchantStatus">● Mağazan yayında</span><div class="grow"></div><select class="lang"><option>TR</option><option>EN</option></select><button class="merchant" onclick="home()">Çıkış</button>';app.innerHTML='<div class="adminWrap merchantWorkspace"><section class="merchantWelcome"><div class="eyebrow">'+s.n.toUpperCase()+' · DİJİTAL MAĞAZA YÖNETİMİ</div><h1>'+s.n+'</h1><p>Burası yalnız bu işletmenin demo yönetim alanı. Ürünlerini ve müşterinin göreceği bilgileri buradan yönetirsin.</p><div class="merchantQuick"><button onclick="store('+idx+')">Müşterinin gördüğü mağaza</button><button onclick="addDemoProduct('+idx+')">＋ Yeni ürün / hizmet</button><button onclick="showMerchantQR('+idx+')">▦ Mağaza QR</button></div></section><div class="metricGrid"><div class="metric"><b>'+(idx<BASE_COUNT?"4.820":"0")+'</b><small>Mağaza ziyareti</small></div><div class="metric"><b>'+(idx<BASE_COUNT?"11.340":"0")+'</b><small>Ürün görüntüleme</small></div><div class="metric"><b>'+(idx<BASE_COUNT?"286":"0")+'</b><small>WhatsApp tıklaması</small></div><div class="metric"><b>'+s.p.length+'</b><small>Yayındaki ürün/hizmet</small></div></div><div class="ownerNote"><b>Tek işletme çalışma alanı</b><small>'+s.n+' ürünleri kendi dijital vitrininin yanında Kemerly müşteri keşfinde de görünür. Bu panel diğer işletmelerin yönetimini açmaz.</small></div><section class="section"><div class="sectionHead"><div><h2>Ürünlerim / Hizmetlerim</h2><p>'+s.p.length+' aktif kayıt</p></div><button onclick="addDemoProduct('+idx+')">+ Yeni</button></div><div class="adminList">'+s.p.map(p=>'<div class="row"><div class="thumb" style="background-image:url(\''+p[2]+'\')"></div><div class="grow"><b>'+p[0]+'</b><small>'+money(p[1])+' · Yayında · 9 dil hedefi</small></div><button class="option" onclick="alert(\'Demo düzenleme ekranı\')">Düzenle</button></div>').join("")+'</div></section><div class="actions"><button class="primary" onclick="store('+idx+')">Mağazamı Önizle</button><button onclick="merchantEntry()">İşletme alanı</button></div></div>';scrollTo(0,0)}
function addDemoProduct(idx){let s=S[idx],name=prompt("Ürün / hizmet adı");if(!name)return;let price=Number(prompt("Fiyat (TL)"));if(!price)return;let desc=prompt("Kısa açıklama")||"İşletme tarafından eklenen demo kayıt.";s.p.push([name,price,s.img,desc]);if(idx>=BASE_COUNT)persistDemoStore(s);admin(idx)}
function showMerchantQR(idx){merchantCreated(idx)}
function favorites(){setBack();app.innerHTML='<section class="section"><div class="sectionHead"><div><h2>Favorilerim</h2><p>Kemer’de tekrar bakmak istediğin yerler.</p></div></div><div class="storeGrid">'+[S[1],S[2],S[0]].map(s=>card(s,S.indexOf(s))).join("")+'</div></section>'}function langDemo(v){if(v!="TR")alert(v+" dil görünümü demo kapsamına hazırlanıyor. Kemerly hedefi 9 dil.")}
function boot(){const p=new URLSearchParams(location.search),slug=p.get("shop");if(slug){const i=S.findIndex(s=>(s.slug||slugify(s.n))===slug);if(i>=0){store(i);return}}home()}boot();
</script></body></html>
