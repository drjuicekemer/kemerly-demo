padding:24px}.merchantWelcome h1{margin:4px 0 7px;font-size:32px}.merchantWelcome p{margin:0;color:#e8dfe2;max-width:650px}.merchantQuick{display:flex;gap:8px;overflow:auto;margin-top:13px}.merchantQuick button{border:0;border-radius:11px;padding:10px 12px;background:#fff;color:#35242a;font-weight:800;white-space:nowrap}.ownerNote{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.ownerNote b{display:block;margin-bottom:3px}.ownerNote small{color:var(--muted);line-height:1.45}.hiddenNav{display:none!important}

const app=document.getElementById("app"),topbar=document.getElementById("top");const money=n=>n.toLocaleString("tr-TR")+" TL";function customerNav(show=true){document.getElementById("bottomNav").classList.toggle("hiddenNav",!show)}
function setBack(fn="home()"){customerNav(true);topbar.className="top";topbar.innerHTML='<button class="back" onclick="'+fn+'">←</button><div class="brand">Kemerl<i>y</i></div><span class="claim">feel like a local.</span><div class="grow"></div><select class="lang"><option>TR</option><option>EN</option><option>RU</option><option>DE</option></select>'}

function card(s,i){return '<article class="store" onclick="store('+i+')"><div class="cover" style="background-image:url(\''+s.img+'\')"><span class="badge verified">✓ Kemerly Verified</span></div><div class="storeBody"><h3>'+s.n+'</h3><div class="meta">'+s.c+' · '+s.r+'<br>'+s.open+'</div><button class="go">Mağazayı keşfet →</button></div></article>'}
function home(){resetTop();app.innerHTML='<section class="hero"><div class="heroContent"><div class="eyebrow">Kemer Dijital Çarşı</div><h1>Kemer’i keşfet.<br>Yerel gibi yaşa.</h1><p>Yerel mağazaları, ürünleri, lezzetleri ve hizmetleri tek yerde keşfet. QR’dan gir, bütün Kemer’e açıl.</p><div class="search"><input id="q" placeholder="Ne arıyorsun? Deri çanta, nar suyu, berber..."><button onclick="searchNow()">Ara</button></div></div></section><div class="stats"><div class="stat"><b>40+</b><small>demo işletme</small></div><div class="stat"><b>5</b><small>Kemer bölgesi</small></div><div class="stat"><b>9</b><small>dil hedefi</small></div></div><section class="section"><div class="sectionHead"><div><h2>Ne arıyorsun?</h2><p>Kemer’de kategori kategori keşfet.</p></div></div><div class="chips"><button class="chip" onclick="category(\'Giyim\')">👗 Giyim</button><button class="chip" onclick="category(\'Deri\')">👜 Deri & Çanta</button><button class="chip" onclick="category(\'Takı\')">💎 Takı & Saat</button><button class="chip" onclick="category(\'İçecek\')">🥤 Yiyecek & İçecek</button><button class="chip" onclick="category(\'Kuaför\')">✂️ Kuaför</button><button class="chip" onclick="category(\'Outdoor\')">🥾 Outdoor</button></div></section><section class="section"><div class="sectionHead"><div><h2>Kemerly seçkisi</h2><p>Bugün keşfedebileceğin yerel noktalar.</p></div><button onclick="discover()">Tümünü gör →</button></div><div class="storeGrid">'+S.slice(0,8).map(card).join("")+'</div></section>';scrollTo(0,0)}
function discover(list=S,title="Kemerly işletmeleri"){setBack();app.innerHTML='<section class="section" style="margin-top:5px"><div class="sectionHead"><div><h2>'+title+'</h2><p>Kemer Merkez · Göynük · Çamyuva · Kiriş · Tekirova</p></div></div><div class="chips"><button class="chip" onclick="discover()">Tümü</button><button class="chip" onclick="region(\'Kemer Merkez\')">Kemer Merkez</button><button class="chip" onclick="region(\'Göynük\')">Göynük</button><button class="chip" onclick="region(\'Çamyuva\')">Çamyuva</button><button class="chip" onclick="region(\'Tekirova\')">Tekirova</button></div><div class="storeGrid" style="margin-top:14px">'+list.map(s=>card(s,S.indexOf(s))).join("")+'</div></section>';scrollTo(0,0)}
function shopType(s){if(s.c.includes("Giyim"))return"fashion";if(s.c.includes("Deri"))return"leather";if(s.c.includes("Kuaför"))return"beauty";if(s.c.includes("Takı"))return"jewel";if(s.c.includes("Hediyelik"))return"gift";if(s.c.includes("Restoran")||s.c.includes("İçecek"))return"food";if(s.c.includes("Outdoor"))return"outdoor";return"food"}
function shopCopy(t){return{fashion:["YENİ SEZON","Kemer stilini keşfet","Hafif dokular, tatil akşamları ve Akdeniz yazı için seçilmiş parçalar.","Koleksiyon"],leather:["DERİ KOLEKSİYONU","Zamansız parçalar","Kemer'de gör, dokun, dene. Seçili çanta ve aksesuarları mağazada keşfet.","Koleksiyon"],beauty:["BAKIM & STİL","Tatil stilin hazır","Kesimden bakıma, ihtiyacın olan hizmeti seç ve işletmeyle hemen iletişime geç.","Hizmetler"],jewel:["SEÇKİ","Akdeniz ışığında detaylar","Tatilinden yanında götüreceğin zarif parçaları keşfet.","Koleksiyon"],gift:["LOCAL PICKS","Kemer'den bir parça götür","Yerel hatıralar, küçük sürprizler ve sevdiklerin için Kemer seçkisi.","Hediyeler"],food:["TADINI KEŞFET","Bugün ne iyi gider?","Menüyü keşfet, içeriğini gör ve Kemer'de favorini bul.","Menü"],outdoor:["KEMER OUTDOOR","Dışarı çık","Kanyon, sahil ve patika için seçilmiş outdoor ürünleri keşfet.","Ekipman"]}[t]}
function store(i){let s=S[i],t=shopType(s),x=shopCopy(t);setBack();app.innerHTML='<div class="shopShell '+t+'"><section class="shopHero" style="background-image:url(\''+s.img+'\')"><div class="shopIdentity"><div class="mini">'+x[0]+' · '+s.r+'</div><h1>'+s.n+'</h1><p>★ 4.8 · '+s.open+' · ✓ Kemerly doğrulamalı demo işletme</p></div></section><div class="shopNav"><button onclick="document.getElementById(\'collection\').scrollIntoView()">'+x[3]+'</button><button onclick="alert(\'Demo: işletmeyle WhatsApp üzerinden iletişim\')">WhatsApp</button><button onclick="showMap('+i+')">Yol Tarifi</button><button onclick="discover()">Kemer\'i Keşfet</button></div><section class="shopPitch"><small>'+x[0]+'</small><h2>'+x[1]+'</h2><p>'+x[2]+'</p></section><section class="section" id="collection"><div class="sectionHead"><div><h2>'+x[3]+'</h2><p>Güncel seçki · fiyatlar TL</p></div></div><div class="productGrid">'+s.p.map((p,j)=>'<article class="product" onclick="product('+i+','+j+')"><div class="productImg" style="background-image:url(\''+p[2]+'\')"></div><div class="productBody"><h3>'+p[0]+'</h3><small>'+p[3]+'</small><div class="price">'+money(p[1])+'</div><button class="primarySale" style="margin-top:10px">İncele →</button></div></article>').join("")+'</div></section><div class="powered">Dijital mağaza altyapısı · Kemerly</div></div>';scrollTo(0,0)}
function product(i,j){let s=S[i],p=s.p[j];setBack("store("+i+")");app.innerHTML='<div class="detail"><div class="detailImg" style="background-image:url(\''+p[2]+'\')"></div><div class="panel"><small>'+s.n+' › '+s.c+'</small><h1>'+p[0]+'</h1><div class="price">'+money(p[1])+'</div><p class="desc">'+p[3]+' Kemerly üzerinden ürünü keşfet; son stok ve seçenekleri doğrudan işletmeye sor.</p><h3>Seçenekler</h3><div class="options"><button class="option">S</button><button class="option">M</button><button class="option">L</button><button class="option">XL</button></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="alert(\'Demo: WhatsApp son işlem noktası\')">WhatsApp’tan Sor</button><button onclick="store('+i+')">Mağazada Gör</button><button onclick="alert(\'Favorilere eklendi\')">♡ Favori</button></div><div class="notice">Kemerly Demo City verisidir. Demo fiyat/stok bilgileri gerçek satış taahhüdü değildir.</div></div></div>';scrollTo(0,0)}
function category(q){discover(S.filter(s=>s.c.includes(q)),q+" kategorisi")}function region(q){discover(S.filter(s=>s.r==q),q)}function searchNow(){let q=(document.getElementById("q").value||"").toLocaleLowerCase("tr");let a=S.filter(s=>(s.n+" "+s.c+" "+s.r+" "+s.p.map(p=>p[0]).join(" ")).toLocaleLowerCase("tr").includes(q));discover(a,"Arama: "+q)}
function showMap(focusIndex){setBack();app.innerHTML='<div class="sectionHead"><div><h2>Kemerly Haritası</h2><p>Kemerly noktalarını haritada keşfet.</p></div></div><div class="mapNote">Demo sürümü: Noktalar Kemer bölgesini göstermek için örnek konumlandırılmıştır; gerçek işletme adresi taahhüdü değildir.</div><div id="kmap" class="map"></div>';scrollTo(0,0);setTimeout(()=>{if(!window.L){document.getElementById("kmap").innerHTML='<div style="padding:24px"><b>Harita yüklenemedi.</b><p>İnternet bağlantını kontrol edip tekrar aç.</p></div>';return}const pts=[[36.6024,30.5598],[36.6005,30.5615],[36.6043,30.5576],[36.5979,30.5631],[36.6060,30.5557],[36.6017,30.5651],[36.6090,30.5541],[36.5958,30.5590],[36.6030,30.5668],[36.6072,30.5627]];const icons=["🥤","👗","👜","✂️","💎","🎁","👕","🥾","☕","👜"];const m=L.map("kmap",{zoomControl:true}).setView([36.6028,30.5608],14);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(m);S.forEach((s,i)=>{const ic=L.divIcon({className:"",html:'<div class="kpin"><span>'+icons[i%icons.length]+'</span></div>',iconSize:[38,38],iconAnchor:[19,38],popupAnchor:[0,-34]});const mk=L.marker(pts[i],{icon:ic}).addTo(m).bindPopup('<div class="mapPopup"><b>'+s.n+'</b><small>'+s.c+' · '+s.r+'<br>Demo Kemerly Noktası</small><button onclick="store('+i+')">Mağazayı Aç →</button></div>');if(i===focusIndex){mk.openPopup();m.setView(pts[i],16)}});setTimeout(()=>m.invalidateSize(),100)},50)}

function admin(){customerNav(false);let s=S[1];topbar.className="merchantTop";topbar.innerHTML='<div class="merchantLogo">ALI MODA</div><span class="merchantStatus">● Mağazan yayında</span><div class="grow"></div><select class="lang"><option>TR</option><option>EN</option></select><button class="merchant" onclick="home()">Çıkış</button>';app.innerHTML='<div class="adminWrap merchantWorkspace"><section class="merchantWelcome"><div class="eyebrow">ALI MODA · DİJİTAL MAĞAZA YÖNETİMİ</div><h1>Günaydın, Ali Moda</h1><p>Burası senin dijital dükkânın. Ürünlerini, vitrini ve müşterinin göreceği bilgileri buradan yönetirsin.</p><div class="merchantQuick"><button onclick="store(1)">Müşterinin gördüğü mağaza</button><button onclick="alert(\'Demo: Fotoğraf yükle → AI ürün kartı → fiyat → yayınla\')">＋ Yeni ürün</button><button onclick="alert(\'QR: Ali Moda mağaza QR\')">▦ Mağaza QR</button></div></section><div class="metricGrid"><div class="metric"><b>4.820</b><small>Mağaza ziyareti</small></div><div class="metric"><b>11.340</b><small>Ürün görüntüleme</small></div><div class="metric"><b>286</b><small>WhatsApp tıklaması</small></div><div class="metric"><b>91</b><small>Yol tarifi</small></div></div><div class="ownerNote"><b>Mağazan internette güncel</b><small>Ali Moda ürünleri kendi dijital vitrininin yanında Kemerly müşteri keşfinde de yayınlanır. Bu yönetim alanından diğer işletmelerin yönetimine erişilemez.</small></div><section class="section"><div class="sectionHead"><div><h2>Ürünlerim</h2><p>4 aktif ürün · bugün güncellendi</p></div><button onclick="alert(\'Demo: yeni ürün akışı\')">+ Yeni ürün</button></div><div class="adminList">'+s.p.map(p=>'<div class="row"><div class="thumb" style="background-image:url(\''+p[2]+'\')"></div><div class="grow"><b>'+p[0]+'</b><small>'+money(p[1])+' · Yayında · 9 dil</small></div><button class="option" onclick="alert(\'Demo ürün düzenleme ekranı\')">Düzenle</button></div>').join("")+'</div></section><div class="actions"><button class="primary" onclick="store(1)">Mağazamı Önizle</button><button onclick="alert(\'Demo: mağaza görünümü, iletişim ve çalışma saatleri\')">Mağaza Bilgileri</button></div></div>';scrollTo(0,0)}
function favorites(){setBack();app.innerHTML='<section class="section"><div class="sectionHead"><div><h2>Favorilerim</h2><p>Kemer’de tekrar bakmak istediğin yerler.</p></div></div><div class="storeGrid">'+[S[1],S[2],S[0]].map(s=>card(s,S.indexOf(s))).join("")+'</div></section>'}function langDemo(v){if(v!="TR")alert(v+" dil görünümü demo kapsamına hazırlanıyor. Kemerly hedefi 9 dil.")}home();
</script></body></html>
